<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>上传 · 蜡染纹样</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7f6;
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .hero-image {
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, #0b3d2e 0%, #1a6b4a 60%, #2d8f6a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
            border-radius: 0 0 24px 24px;
            margin-bottom: 14px;
        }

            .hero-image .overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 12px 20px 10px;
                background: linear-gradient(transparent, rgba(0,0,0,0.5));
                text-align: center;
            }

                .hero-image .overlay h1 {
                    font-size: 1.1rem;
                    font-weight: 700;
                }

                .hero-image .overlay p {
                    font-size: 0.7rem;
                    opacity: 0.85;
                }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1a6b4a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 10px;
            padding: 6px 0;
        }

            .back-link:active {
                opacity: 0.6;
            }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

            .card-title .icon {
                font-size: 1.1rem;
            }

        .btn {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
            min-height: 46px;
            text-decoration: none;
        }

            .btn:active {
                transform: scale(0.95);
            }

        .btn-primary {
            background: #1a6b4a;
            color: #fff;
        }

            .btn-primary:active {
                background: #0b3d2e;
            }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

            .btn-secondary:active {
                background: #d1d5db;
            }

        .btn-danger {
            background: #dc2626;
            color: #fff;
        }

            .btn-danger:active {
                background: #b91c1c;
            }

        .btn-block {
            display: block;
            width: 100%;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

            .btn-group .btn {
                flex: 1;
            }

        .btn:disabled {
            opacity: 0.5;
            transform: none !important;
            cursor: not-allowed;
        }

        .file-select-area {
            display: flex;
            gap: 10px;
            align-items: center;
            background: #f9fafb;
            padding: 12px 14px;
            border-radius: 12px;
            border: 2px dashed #d1d5db;
            margin-bottom: 10px;
        }

            .file-select-area .file-info {
                flex: 1;
                font-size: 0.8rem;
                color: #6b7280;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

                .file-select-area .file-info .file-name {
                    color: #1a1a2e;
                    font-weight: 500;
                }

        #fileInput {
            display: none;
        }

        .status-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
            align-items: center;
            gap: 8px;
        }

            .status-box.show {
                display: flex;
            }

            .status-box.idle {
                display: flex;
                background: #f3f4f6;
                color: #6b7280;
            }

            .status-box.loading {
                background: #fef3c7;
                color: #92400e;
            }

            .status-box.success {
                background: #d1fae5;
                color: #065f46;
            }

            .status-box.error {
                background: #fecaca;
                color: #991b1b;
            }

            .status-box .spinner {
                display: inline-block;
                width: 18px;
                height: 18px;
                border: 3px solid #fef3c7;
                border-top: 3px solid #92400e;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                flex-shrink: 0;
            }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-box .status-icon {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e5e7eb;
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
            display: none;
        }

            .progress-bar.show {
                display: block;
            }

            .progress-bar .progress-fill {
                height: 100%;
                background: linear-gradient(90deg, #1a6b4a, #2d8f6a);
                border-radius: 4px;
                width: 0%;
                transition: width 0.3s ease;
            }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .preview-item {
            aspect-ratio: 1/1;
            border-radius: 10px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            overflow: hidden;
            position: relative;
            border: 2px solid #e5e7eb;
        }

            .preview-item.has-image {
                border-color: #1a6b4a;
            }

            .preview-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .preview-item .empty-text {
                color: #9ca3af;
                font-size: 0.65rem;
            }

            .preview-item .delete-btn {
                position: absolute;
                top: 4px;
                right: 4px;
                background: rgba(220,38,38,0.92);
                color: #fff;
                border: none;
                border-radius: 50%;
                width: 26px;
                height: 26px;
                font-size: 0.8rem;
                cursor: pointer;
                display: none;
                box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            }

            .preview-item.has-image .delete-btn {
                display: block;
            }

        .result-detail {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.8rem;
            display: none;
        }

            .result-detail.show {
                display: block;
            }

            .result-detail .detail-item {
                display: flex;
                justify-content: space-between;
                padding: 3px 0;
                border-bottom: 1px solid #e5e7eb;
            }

                .result-detail .detail-item:last-child {
                    border-bottom: none;
                }

                .result-detail .detail-item .ok {
                    color: #16a34a;
                }

                .result-detail .detail-item .fail {
                    color: #dc2626;
                }

        .footer-tip {
            text-align: center;
            font-size: 0.65rem;
            color: #9ca3af;
            padding: 6px 0;
        }

        .count-badge {
            display: inline-block;
            background: #d1fae5;
            color: #065f46;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 400;
            margin-left: auto;
        }

        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.8rem;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

            .toast.show {
                opacity: 1;
            }

        .cloud-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: #6b7280;
            padding: 4px 10px;
            background: #f3f4f6;
            border-radius: 6px;
            margin-bottom: 8px;
        }

            .cloud-status .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                display: inline-block;
            }

                .cloud-status .dot.online {
                    background: #16a34a;
                }

                .cloud-status .dot.offline {
                    background: #dc2626;
                }
    </style>
</head>
<body>

    <div class="hero-image">
        <div class="overlay">
            <h1>📸 上传纹样</h1>
            <p>蜡染纹样 · 云端同步</p>
        </div>
    </div>

    <div class="container" style="padding:0;">

        <a href="services.html" class="back-link">← 返回资源库</a>

        <div class="card">
            <div class="card-title">
                <span class="icon">📤</span> 上传图片
                <span class="count-badge" id="countBadge">0 / 6</span>
            </div>

            <div class="cloud-status">
                <span class="dot online" id="cloudDot"></span>
                <span id="cloudStatusText">☁️ 云端已连接</span>
            </div>

            <div class="file-select-area" id="fileSelectArea">
                <span style="font-size:1.3rem;">📁</span>
                <span class="file-info" id="fileInfo">
                    <span class="file-name" id="fileNameDisplay">未选择文件</span>
                    <span id="fileSizeDisplay"></span>
                </span>
                <button class="btn btn-secondary" id="selectBtn" style="min-height:36px; padding:6px 14px; font-size:0.8rem; flex-shrink:0;">选择</button>
            </div>

            <input type="file" id="fileInput" accept="image/*" />

            <button class="btn btn-primary btn-block" id="uploadBtn" disabled>⬆️ 上传到图床</button>

            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="status-box idle show" id="statusBox">
                <span class="status-icon">💡</span>
                <span id="statusText">请选择一张图片</span>
            </div>

            <div class="result-detail" id="resultDetail"></div>

            <div class="preview-grid" id="previewGrid">
                <div class="preview-item" data-index="0"><span class="empty-text">空</span></div>
                <div class="preview-item" data-index="1"><span class="empty-text">空</span></div>
                <div class="preview-item" data-index="2"><span class="empty-text">空</span></div>
                <div class="preview-item" data-index="3"><span class="empty-text">空</span></div>
                <div class="preview-item" data-index="4"><span class="empty-text">空</span></div>
                <div class="preview-item" data-index="5"><span class="empty-text">空</span></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-danger" id="clearBtn">🗑️ 清空</button>
                <button class="btn btn-secondary" id="copyAllBtn" style="display:none;">📋 复制链接</button>
            </div>

            <div class="footer-tip">💡 上传后自动同步到云端，所有设备可查看</div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ✅ 配置
        // ============================================================
        const API_KEY = '0ea23939f1d10b379f977422b6b9658a';
        const BIN_ID = '6a6a1c77da38895dfea04a9c';
        const JSONBIN_KEY = '$2a$10$Zg02sHzfAK.F/xlvECOq1uOPkJrNLAPj7aBVmM8d.YMsvq4j.apUm';
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // ============================================================
        // DOM
        // ============================================================
        const selectBtn = document.getElementById('selectBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyAllBtn = document.getElementById('copyAllBtn');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const fileSizeDisplay = document.getElementById('fileSizeDisplay');
        const previewGrid = document.getElementById('previewGrid');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const resultDetail = document.getElementById('resultDetail');
        const countBadge = document.getElementById('countBadge');
        const toast = document.getElementById('toast');
        const cloudStatusText = document.getElementById('cloudStatusText');
        const cloudDot = document.getElementById('cloudDot');

        let uploadedImages = [];
        let selectedFile = null;
        let isUploading = false;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        function updateCount() {
            countBadge.textContent = uploadedImages.length + ' / 6';
        }

        function setStatus(message, type, icon) {
            statusBox.className = 'status-box show ' + type;
            statusText.textContent = message;
            const iconEl = statusBox.querySelector('.status-icon');
            if (icon) iconEl.textContent = icon;
        }

        function resetStatus() {
            statusBox.className = 'status-box idle show';
            statusText.textContent = '请选择一张图片';
            statusBox.querySelector('.status-icon').textContent = '💡';
        }

        function showProgress(percent) {
            progressBar.classList.add('show');
            progressFill.style.width = percent + '%';
        }

        function hideProgress() {
            progressBar.classList.remove('show');
            progressFill.style.width = '0%';
        }

        // ============================================================
        // 云端同步（修复版 - 强制写入）
        // ============================================================
        async function syncToCloud(imageList) {
            try {
                cloudStatusText.textContent = '☁️ 正在同步...';
                cloudDot.className = 'dot online';

                // 1. 先读取云端现有数据
                const getRes = await fetch(BIN_URL, {
                    headers: {
                        'X-Master-Key': JSONBIN_KEY,
                        'Cache-Control': 'no-cache'
                    }
                });

                let existing = [];
                if (getRes.ok) {
                    const data = await getRes.json();
                    existing = data.record?.images || [];
                    console.log('📥 云端现有:', existing.length, '张');
                } else {
                    console.warn('⚠️ 读取云端失败，将创建新数据');
                }

                // 2. 合并去重（云端 + 新图片）
                const all = [...existing, ...imageList];
                const seen = new Set();
                const merged = all.filter(img => {
                    if (!img || !img.url) return false;
                    if (seen.has(img.url)) return false;
                    seen.add(img.url);
                    return true;
                });

                console.log('📤 准备写入云端:', merged.length, '张');

                // 3. 写入云端
                const putRes = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_KEY
                    },
                    body: JSON.stringify({ images: merged })
                });

                if (putRes.ok) {
                    const result = await putRes.json();
                    console.log('✅ 同步成功:', result);
                    cloudDot.className = 'dot online';
                    cloudStatusText.textContent = '☁️ 已同步 (' + merged.length + ' 张)';

                    // 同时保存到本地 localStorage
                    try {
                        localStorage.setItem('wax_image_list', JSON.stringify(merged));
                    } catch (e) { }

                    return true;
                } else {
                    const err = await putRes.text();
                    console.error('❌ 同步失败:', putRes.status, err);
                    cloudDot.className = 'dot offline';
                    cloudStatusText.textContent = '⚠️ 同步失败 (' + putRes.status + ')';
                    return false;
                }
            } catch (e) {
                console.error('❌ 同步异常:', e);
                cloudDot.className = 'dot offline';
                cloudStatusText.textContent = '⚠️ 网络异常';
                return false;
            }
        }

        // ============================================================
        // 渲染预览
        // ============================================================
        function renderPreview() {
            const items = previewGrid.querySelectorAll('.preview-item');
            items.forEach((item, index) => {
                if (index < uploadedImages.length) {
                    const imgData = uploadedImages[index];
                    item.classList.add('has-image');
                    item.innerHTML = `
                            <img src="${imgData.url}" alt="${imgData.name}" loading="lazy" />
                            <button class="delete-btn" data-index="${index}">✕</button>
                        `;
                    item.querySelector('.delete-btn').addEventListener('click', function (e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index);
                        deleteImage(idx);
                    });
                } else {
                    item.classList.remove('has-image');
                    item.innerHTML = `<span class="empty-text">空</span>`;
                }
            });

            copyAllBtn.style.display = uploadedImages.length > 0 ? 'block' : 'none';
            updateCount();
            resultDetail.classList.remove('show');
        }

        // ============================================================
        // 删除
        // ============================================================
        function deleteImage(index) {
            uploadedImages.splice(index, 1);
            renderPreview();
            if (uploadedImages.length === 0) resetStatus();
            syncToCloud([]);
            showToast('🗑️ 已删除');
        }

        function clearAll() {
            if (uploadedImages.length === 0 && !selectedFile) return;
            if (confirm('确定要清空所有图片吗？')) {
                uploadedImages = [];
                selectedFile = null;
                fileInput.value = '';
                fileNameDisplay.textContent = '未选择文件';
                fileSizeDisplay.textContent = '';
                uploadBtn.disabled = true;
                renderPreview();
                resultDetail.classList.remove('show');
                resetStatus();
                hideProgress();
                syncToCloud([]);
                showToast('🗑️ 已清空');
            }
        }

        // ============================================================
        // 上传到 ImgBB
        // ============================================================
        function uploadToImgBB(file) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('key', API_KEY);
                formData.append('image', file);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'https://api.imgbb.com/1/upload');

                xhr.upload.onprogress = function (e) {
                    if (e.lengthComputable) {
                        showProgress(Math.round((e.loaded / e.total) * 100));
                    }
                };

                xhr.onload = function () {
                    if (xhr.status === 200) {
                        try {
                            const data = JSON.parse(xhr.responseText);
                            if (data.success) {
                                resolve({
                                    url: data.data.url,
                                    displayUrl: data.data.display_url,
                                    name: file.name,
                                    size: file.size,
                                    width: data.data.width || 0,
                                    height: data.data.height || 0,
                                    deleteUrl: data.data.delete_url || ''
                                });
                            } else {
                                reject(new Error(data.error?.message || '上传失败'));
                            }
                        } catch (e) {
                            reject(new Error('解析响应失败'));
                        }
                    } else {
                        reject(new Error('HTTP ' + xhr.status));
                    }
                };

                xhr.onerror = function () {
                    reject(new Error('网络连接失败'));
                };

                xhr.send(formData);
            });
        }

        // ============================================================
        // 验证上传
        // ============================================================
        async function verifyUpload(url) {
            try {
                const response = await fetch(url, { method: 'HEAD' });
                return response.ok;
            } catch (e) {
                return false;
            }
        }

        // ============================================================
        // 执行上传
        // ============================================================
        async function handleUpload() {
            if (!selectedFile) {
                setStatus('请先选择一张图片', 'error', '❌');
                return;
            }
            if (isUploading) return;
            if (uploadedImages.length >= 6) {
                setStatus('最多上传 6 张图片', 'error', '❌');
                return;
            }
            if (!selectedFile.type.startsWith('image/')) {
                setStatus('请选择图片文件', 'error', '❌');
                return;
            }
            if (selectedFile.size > 50 * 1024 * 1024) {
                setStatus('图片超过 50MB', 'error', '❌');
                return;
            }

            isUploading = true;
            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ 上传中...';
            setStatus('⏳ 正在上传到图床...', 'loading', '⏳');

            try {
                const result = await uploadToImgBB(selectedFile);
                setStatus('⏳ 正在检测上传结果...', 'loading', '⏳');
                const isVerified = await verifyUpload(result.url);

                if (isVerified) {
                    uploadedImages.push(result);
                    renderPreview();

                    // ===== 关键：同步到云端 =====
                    setStatus('⏳ 正在同步到云端...', 'loading', '⏳');
                    const synced = await syncToCloud([result]);

                    if (synced) {
                        setStatus('✅ 上传成功！已同步到云端', 'success', '✅');
                        showToast('✅ 图片已上传并同步到云端');
                    } else {
                        setStatus('⚠️ 上传成功，但云端同步失败', 'error', '⚠️');
                        showToast('⚠️ 图片已上传，但云端同步失败，请稍后重试');
                    }

                    showResultDetail(true, result);
                    copyAllBtn.style.display = 'block';

                    selectedFile = null;
                    fileInput.value = '';
                    fileNameDisplay.textContent = '未选择文件';
                    fileSizeDisplay.textContent = '';
                    uploadBtn.disabled = true;
                    uploadBtn.textContent = '⬆️ 上传到图床';

                    // 跳转到展示页
                    setTimeout(() => {
                        window.location.href = 'gallery.html?img=' + encodeURIComponent(JSON.stringify(result));
                    }, 1500);

                } else {
                    setStatus('⚠️ 上传成功但验证失败', 'error', '⚠️');
                    showResultDetail(false, null, '验证失败');
                }

            } catch (error) {
                setStatus('❌ 上传失败：' + error.message, 'error', '❌');
                showResultDetail(false, null, error.message);
                console.error('上传失败:', error);
            }

            isUploading = false;
            uploadBtn.disabled = false;
            uploadBtn.textContent = '⬆️ 上传到图床';
            hideProgress();
        }

        function showResultDetail(success, result, errorMsg) {
            resultDetail.classList.add('show');
            if (success && result) {
                resultDetail.innerHTML = `
                        <div style="font-weight:600; margin-bottom:4px; color:#16a34a;">✅ 上传成功</div>
                        <div class="detail-item"><span>📷 尺寸</span><span>${result.width} × ${result.height}</span></div>
                        <div class="detail-item"><span>📦 大小</span><span>${formatSize(result.size)}</span></div>
                        <div class="detail-item"><span>☁️ 云端同步</span><span class="ok">✅ 已同步</span></div>
                        <div class="detail-item"><span>🔗 链接</span><span style="font-size:0.65rem;word-break:break-all;"><a href="${result.url}" target="_blank">查看</a></span></div>
                    `;
            } else {
                resultDetail.innerHTML = `
                        <div style="font-weight:600; margin-bottom:4px; color:#dc2626;">❌ 上传失败</div>
                        <div class="detail-item"><span>🔍 错误</span><span class="fail">${errorMsg || '未知错误'}</span></div>
                    `;
            }
        }

        function selectFile() {
            if (isUploading) return;
            fileInput.click();
        }

        function copyAllUrls() {
            const urls = uploadedImages.map(img => img.url).join('\n');
            if (!urls) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(urls).then(() => {
                    setStatus('✅ 已复制 ' + uploadedImages.length + ' 个链接', 'success', '✅');
                    setTimeout(resetStatus, 2000);
                }).catch(() => fallbackCopy(urls));
            } else {
                fallbackCopy(urls);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                setStatus('✅ 已复制 ' + uploadedImages.length + ' 个链接', 'success', '✅');
                setTimeout(resetStatus, 2000);
            } catch (e) {
                alert('复制失败，请手动复制：\n\n' + text);
            }
            document.body.removeChild(textarea);
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        selectBtn.addEventListener('click', selectFile);
        uploadBtn.addEventListener('click', handleUpload);
        clearBtn.addEventListener('click', clearAll);
        copyAllBtn.addEventListener('click', copyAllUrls);

        fileInput.addEventListener('change', function () {
            if (this.files.length > 0) {
                const file = this.files[0];
                selectedFile = file;
                fileNameDisplay.textContent = file.name;
                fileSizeDisplay.textContent = ' (' + formatSize(file.size) + ')';
                uploadBtn.disabled = false;

                const reader = new FileReader();
                reader.onload = function (e) {
                    const firstItem = previewGrid.querySelector('.preview-item');
                    if (!firstItem.classList.contains('has-image')) {
                        firstItem.innerHTML = `
                                <img src="${e.target.result}" alt="预览" loading="lazy" style="opacity:0.6;" />
                                <span style="position:absolute; bottom:4px; font-size:0.5rem; background:rgba(0,0,0,0.6); color:#fff; padding:0 8px; border-radius:8px;">待上传</span>
                            `;
                        firstItem.classList.add('has-image');
                    }
                };
                reader.readAsDataURL(file);
                setStatus('📁 已选择: ' + file.name, 'idle', '📁');
            }
        });

        // ============================================================
        // 初始化
        // ============================================================
        renderPreview();
        resetStatus();
        cloudDot.className = 'dot online';
        cloudStatusText.textContent = '☁️ 云端已连接';

        console.log('📸 上传已启动');
        console.log('📌 Bin ID:', BIN_ID);
    </script>

</body>
</html>
