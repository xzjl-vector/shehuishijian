<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>图片展示 · 蜡染纹样</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7f6;
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .hero-image {
            width: 100%;
            height: 120px;
            background: linear-gradient(135deg, #0b3d2e 0%, #1a6b4a 60%, #2d8f6a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
            border-radius: 0 0 30px 30px;
            margin-bottom: 16px;
        }

            .hero-image .overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 14px 20px 12px;
                background: linear-gradient(transparent, rgba(0, 0, 0, 0.5));
                text-align: center;
            }

                .hero-image .overlay h1 {
                    font-size: 1.2rem;
                    font-weight: 700;
                }

                .hero-image .overlay p {
                    font-size: 0.75rem;
                    opacity: 0.85;
                }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1a6b4a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 12px;
            padding: 8px 0;
            -webkit-tap-highlight-color: transparent;
        }

            .back-link:active {
                opacity: 0.6;
            }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.03);
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

            .card-title .count {
                font-size: 0.75rem;
                font-weight: 400;
                color: #6b7280;
                background: #f3f4f6;
                padding: 2px 14px;
                border-radius: 20px;
            }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .gallery-item {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background: #f3f4f6;
            position: relative;
            border: 2px solid #e5e7eb;
            transition: 0.2s;
            cursor: pointer;
        }

            .gallery-item:active {
                transform: scale(0.97);
            }

            .gallery-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .gallery-item .img-index {
                position: absolute;
                bottom: 6px;
                left: 6px;
                background: rgba(0, 0, 0, 0.6);
                color: #fff;
                font-size: 0.6rem;
                padding: 2px 10px;
                border-radius: 12px;
            }

            .gallery-item .delete-btn {
                position: absolute;
                top: 6px;
                right: 6px;
                background: rgba(220, 38, 38, 0.9);
                color: #fff;
                border: none;
                border-radius: 50%;
                width: 28px;
                height: 28px;
                font-size: 0.85rem;
                cursor: pointer;
                box-shadow: 0 2px 8px rgba(0,0,0,0.2);
                display: none;
                z-index: 5;
            }

            .gallery-item:hover .delete-btn {
                display: block;
            }

            .gallery-item .delete-btn:active {
                transform: scale(0.85);
            }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9ca3af;
        }

            .empty-state .icon {
                font-size: 3rem;
                display: block;
                margin-bottom: 10px;
            }

            .empty-state .text {
                font-size: 0.95rem;
            }

            .empty-state .hint {
                font-size: 0.8rem;
                margin-top: 4px;
            }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

            .loading-state .spinner {
                display: inline-block;
                width: 36px;
                height: 36px;
                border: 4px solid #e5e7eb;
                border-top: 4px solid #1a6b4a;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-bottom: 10px;
            }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .btn {
            display: inline-block;
            padding: 14px 20px;
            border-radius: 14px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
            min-height: 52px;
            text-decoration: none;
        }

            .btn:active {
                transform: scale(0.95);
            }

        .btn-primary {
            background: #1a6b4a;
            color: #fff;
        }

            .btn-primary:active {
                background: #0b3d2e;
            }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

            .btn-secondary:active {
                background: #d1d5db;
            }

        .btn-danger {
            background: #dc2626;
            color: #fff;
        }

            .btn-danger:active {
                background: #b91c1c;
            }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

            .btn-group .btn {
                flex: 1;
            }

        .footer-text {
            text-align: center;
            font-size: 0.7rem;
            color: #9ca3af;
            padding: 16px 0 8px;
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 0.85rem;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

            .toast.show {
                opacity: 1;
            }

        .cloud-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 8px;
            padding: 6px 12px;
            background: #f3f4f6;
            border-radius: 8px;
        }

            .cloud-status .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                display: inline-block;
            }

                .cloud-status .dot.online {
                    background: #16a34a;
                }

                .cloud-status .dot.offline {
                    background: #dc2626;
                }

        .refresh-tip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 0.75rem;
            color: #6b7280;
        }

            .refresh-tip .clickable {
                color: #1a6b4a;
                font-weight: 600;
                cursor: pointer;
                text-decoration: underline;
            }

                .refresh-tip .clickable:active {
                    opacity: 0.6;
                }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

            .modal-overlay.show {
                display: flex;
            }

        .modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 28px 24px 20px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }

            .modal-box .modal-icon {
                font-size: 2.8rem;
                margin-bottom: 8px;
            }

            .modal-box .modal-title {
                font-size: 1.1rem;
                font-weight: 600;
                margin-bottom: 4px;
            }

            .modal-box .modal-desc {
                font-size: 0.9rem;
                color: #6b7280;
                margin-bottom: 16px;
            }

            .modal-box .modal-btns {
                display: flex;
                gap: 10px;
            }

                .modal-box .modal-btns .btn {
                    flex: 1;
                    min-height: 44px;
                    padding: 10px;
                    font-size: 0.9rem;
                }

        .btn-ghost {
            background: #f3f4f6;
            color: #374151;
        }

            .btn-ghost:active {
                background: #e5e7eb;
            }
    </style>
</head>
<body>

    <div class="hero-image">
        <div class="overlay">
            <h1>📸 纹样展示</h1>
            <p>蜡染纹样 · 云端相册</p>
        </div>
    </div>

    <div class="container" style="padding:0;">

        <a href="services.html" class="back-link">← 返回资源库</a>

        <div class="card">
            <div class="card-title">
                <span>🖼️ 所有图片</span>
                <span class="count" id="countDisplay">加载中...</span>
            </div>

            <div class="cloud-status">
                <span class="dot online" id="cloudDot"></span>
                <span id="cloudStatusText">☁️ 正在连接云端...</span>
            </div>

            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <div>正在从云端加载图片...</div>
            </div>

            <div class="gallery-grid" id="galleryGrid" style="display:none;"></div>

            <div class="empty-state" id="emptyState" style="display:none;">
                <span class="icon">🖼️</span>
                <div class="text">还没有上传图片</div>
                <div class="hint">点击下方按钮上传蜡染纹样</div>
            </div>

            <div class="refresh-tip">
                🔄 数据来自云端
                <span class="clickable" id="manualRefresh">点击刷新</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="upload.html" class="btn btn-primary">📤 上传图片</a>
            <button class="btn btn-secondary" id="refreshBtn">🔄 刷新</button>
        </div>

        <div class="storage-info" style="background:#f0fdf4; border-radius:12px; padding:12px 16px; margin-top:10px; font-size:0.8rem; color:#065f46; border:1px solid #a7f3d0;">
            💡 图片存储在 <strong>ImgBB 图床</strong>，链接同步到云端
            <br />
            <span style="font-size:0.7rem; opacity:0.7;">所有设备共享同一个云端数据</span>
        </div>

        <div class="footer-text">北京科技大学 染叙丹青实践小队</div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-icon">⚠️</div>
            <div class="modal-title">确认删除</div>
            <div class="modal-desc">确定要删除这张图片吗？</div>
            <div class="modal-btns">
                <button class="btn btn-ghost" id="modalCancel">取消</button>
                <button class="btn btn-danger" id="modalConfirm">确认删除</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ✅ 新 Bin ID 配置
        // ============================================================
        const BIN_ID = '6a6a1c77da38895dfea04a9c';
        const JSONBIN_KEY = '$2a$10$Zg02sHzfAK.F/xlvECOq1uOPkJrNLAPj7aBVmM8d.YMsvq4j.apUm';
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // ============================================================
        // DOM 引用
        // ============================================================
        const galleryGrid = document.getElementById('galleryGrid');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const countDisplay = document.getElementById('countDisplay');
        const refreshBtn = document.getElementById('refreshBtn');
        const manualRefresh = document.getElementById('manualRefresh');
        const toast = document.getElementById('toast');
        const cloudStatusText = document.getElementById('cloudStatusText');
        const cloudDot = document.getElementById('cloudDot');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalCancel = document.getElementById('modalCancel');
        const modalConfirm = document.getElementById('modalConfirm');

        let images = [];
        let isLoading = false;
        let deleteTargetIndex = -1;

        // ============================================================
        // Toast
        // ============================================================
        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // 从云端加载
        // ============================================================
        async function loadFromCloud() {
            if (isLoading) return;
            isLoading = true;

            try {
                loadingState.style.display = 'block';
                galleryGrid.style.display = 'none';
                emptyState.style.display = 'none';
                countDisplay.textContent = '加载中...';
                cloudStatusText.textContent = '☁️ 正在加载...';

                const url = BIN_URL + '?t=' + Date.now();

                const response = await fetch(url, {
                    headers: {
                        'X-Master-Key': JSONBIN_KEY,
                        'Cache-Control': 'no-cache, no-store, must-revalidate'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    images = data.record?.images || [];
                    images = images.filter(img => img && img.url);

                    cloudDot.className = 'dot online';
                    cloudStatusText.textContent = '☁️ 已连接 (' + images.length + ' 张)';
                    renderGallery();

                    if (images.length > 0) {
                        showToast('✅ 已加载 ' + images.length + ' 张图片');
                    }
                    return images;
                } else {
                    const errorText = await response.text();
                    console.error('加载失败:', response.status, errorText);
                    cloudDot.className = 'dot offline';
                    cloudStatusText.textContent = '⚠️ 加载失败 (HTTP ' + response.status + ')';
                    showToast('⚠️ 加载失败，请刷新重试');
                    return null;
                }
            } catch (e) {
                console.error('加载失败:', e);
                cloudDot.className = 'dot offline';
                cloudStatusText.textContent = '⚠️ 网络异常';
                showToast('⚠️ 网络异常，请检查连接');
                return null;
            } finally {
                loadingState.style.display = 'none';
                isLoading = false;
            }
        }

        // ============================================================
        // 同步到云端（删除后更新）
        // ============================================================
        async function syncToCloud(imageList) {
            try {
                const putRes = await fetch(BIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_KEY
                    },
                    body: JSON.stringify({ images: imageList })
                });

                if (putRes.ok) {
                    console.log('✅ 云端已更新');
                    return true;
                } else {
                    console.error('❌ 更新失败');
                    return false;
                }
            } catch (e) {
                console.error('❌ 同步异常:', e);
                return false;
            }
        }

        // ============================================================
        // 渲染
        // ============================================================
        function renderGallery() {
            if (images.length === 0) {
                galleryGrid.style.display = 'none';
                emptyState.style.display = 'block';
                countDisplay.textContent = '0 张';
                return;
            }

            galleryGrid.style.display = 'grid';
            emptyState.style.display = 'none';
            countDisplay.textContent = images.length + ' 张';

            galleryGrid.innerHTML = '';

            images.forEach((imgData, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                        <img src="${imgData.url}" alt="${imgData.name || '纹样'}" loading="lazy" />
                        <button class="delete-btn" data-index="${index}">✕</button>
                        <span class="img-index">#${index + 1}</span>
                    `;

                // 删除按钮
                item.querySelector('.delete-btn').addEventListener('click', function (e) {
                    e.stopPropagation();
                    deleteTargetIndex = parseInt(this.dataset.index);
                    modalOverlay.classList.add('show');
                });

                // 点击查看原图
                item.addEventListener('click', function () {
                    const idx = parseInt(this.querySelector('.delete-btn').dataset.index);
                    const img = images[idx];
                    if (img && img.url) {
                        window.open(img.url, '_blank');
                    }
                });

                galleryGrid.appendChild(item);
            });
        }

        // ============================================================
        // 删除图片
        // ============================================================
        async function deleteImage(index) {
            if (index < 0 || index >= images.length) return;
            images.splice(index, 1);
            await syncToCloud(images);
            renderGallery();
            showToast('✅ 已删除');
        }

        // ============================================================
        // 刷新
        // ============================================================
        async function refresh() {
            showToast('🔄 刷新中...');
            await loadFromCloud();
            if (images.length > 0) {
                showToast('✅ 已刷新，共 ' + images.length + ' 张图片');
            }
        }

        // ============================================================
        // 从 URL 参数接收新图片
        // ============================================================
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const imgData = params.get('img');

            if (imgData) {
                try {
                    const decoded = decodeURIComponent(imgData);
                    const data = JSON.parse(decoded);
                    if (data && data.url) {
                        setTimeout(() => {
                            loadFromCloud();
                            showToast('✅ 新图片已添加');
                        }, 800);
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (e) {
                    console.error('解析失败:', e);
                }
            }
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        refreshBtn.addEventListener('click', refresh);
        manualRefresh.addEventListener('click', refresh);

        modalCancel.addEventListener('click', () => {
            deleteTargetIndex = -1;
            modalOverlay.classList.remove('show');
        });

        modalConfirm.addEventListener('click', async () => {
            if (deleteTargetIndex >= 0) {
                await deleteImage(deleteTargetIndex);
                deleteTargetIndex = -1;
            }
            modalOverlay.classList.remove('show');
        });

        modalOverlay.addEventListener('click', function (e) {
            if (e.target === this) {
                deleteTargetIndex = -1;
                modalOverlay.classList.remove('show');
            }
        });

        // ============================================================
        // 初始化
        // ============================================================
        async function init() {
            await loadFromCloud();
            checkUrlParams();
            console.log('📸 云端图片展示页已加载');
            console.log('📌 Bin ID:', BIN_ID);
            console.log('📊 图片数量:', images.length);
        }

        init();
    </script>

</body>
</html>
