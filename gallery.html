<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>图片展示 · 蜡染纹样</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7f6;
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .hero-image {
            width: 100%;
            height: 100px;
            background: linear-gradient(135deg, #0b3d2e 0%, #1a6b4a 60%, #2d8f6a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
            border-radius: 0 0 24px 24px;
            margin-bottom: 14px;
        }

            .hero-image .overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 12px 20px 10px;
                background: linear-gradient(transparent, rgba(0,0,0,0.5));
                text-align: center;
            }

                .hero-image .overlay h1 {
                    font-size: 1.1rem;
                    font-weight: 700;
                }

                .hero-image .overlay p {
                    font-size: 0.7rem;
                    opacity: 0.85;
                }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1a6b4a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
            margin-bottom: 10px;
            padding: 6px 0;
        }

            .back-link:active {
                opacity: 0.6;
            }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.03);
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

            .card-title .count {
                font-size: 0.7rem;
                font-weight: 400;
                color: #6b7280;
                background: #f3f4f6;
                padding: 2px 12px;
                border-radius: 20px;
            }

        .gallery-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }

        .gallery-item {
            aspect-ratio: 1/1;
            border-radius: 10px;
            overflow: hidden;
            background: #f3f4f6;
            position: relative;
            border: 2px solid #e5e7eb;
            transition: 0.15s;
            cursor: pointer;
        }

            .gallery-item:active {
                transform: scale(0.95);
            }

            .gallery-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }

            .gallery-item .img-index {
                position: absolute;
                bottom: 4px;
                left: 4px;
                background: rgba(0,0,0,0.6);
                color: #fff;
                font-size: 0.5rem;
                padding: 1px 8px;
                border-radius: 10px;
            }

        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: #9ca3af;
        }

            .empty-state .icon {
                font-size: 2.5rem;
                display: block;
                margin-bottom: 8px;
            }

            .empty-state .text {
                font-size: 0.9rem;
            }

            .empty-state .hint {
                font-size: 0.75rem;
                margin-top: 4px;
            }

        .loading-state {
            text-align: center;
            padding: 30px 20px;
            color: #6b7280;
        }

            .loading-state .spinner {
                display: inline-block;
                width: 30px;
                height: 30px;
                border: 3px solid #e5e7eb;
                border-top: 3px solid #1a6b4a;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin-bottom: 8px;
            }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .btn {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            -webkit-tap-highlight-color: transparent;
            text-align: center;
            min-height: 46px;
            text-decoration: none;
        }

            .btn:active {
                transform: scale(0.95);
            }

        .btn-primary {
            background: #1a6b4a;
            color: #fff;
        }

            .btn-primary:active {
                background: #0b3d2e;
            }

        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }

            .btn-secondary:active {
                background: #d1d5db;
            }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

            .btn-group .btn {
                flex: 1;
            }

        .footer-text {
            text-align: center;
            font-size: 0.65rem;
            color: #9ca3af;
            padding: 12px 0 6px;
        }

        .toast {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px 20px;
            border-radius: 10px;
            font-size: 0.8rem;
            z-index: 300;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            max-width: 90%;
            text-align: center;
        }

            .toast.show {
                opacity: 1;
            }

        .cloud-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            color: #6b7280;
            padding: 4px 10px;
            background: #f3f4f6;
            border-radius: 6px;
            margin-bottom: 8px;
        }

            .cloud-status .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                display: inline-block;
            }

                .cloud-status .dot.online {
                    background: #16a34a;
                }

                .cloud-status .dot.offline {
                    background: #dc2626;
                }

        .refresh-tip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 0.7rem;
            color: #6b7280;
        }

            .refresh-tip .clickable {
                color: #1a6b4a;
                font-weight: 600;
                cursor: pointer;
                text-decoration: underline;
            }

        .storage-info {
            background: #f0fdf4;
            border-radius: 10px;
            padding: 10px 14px;
            margin-top: 8px;
            font-size: 0.75rem;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>

    <div class="hero-image">
        <div class="overlay">
            <h1>📸 纹样展示</h1>
            <p>蜡染纹样 · 云端相册</p>
        </div>
    </div>

    <div class="container" style="padding:0;">

        <a href="services.html" class="back-link">← 返回资源库</a>

        <div class="card">
            <div class="card-title">
                <span>🖼️ 所有图片</span>
                <span class="count" id="countDisplay">加载中...</span>
            </div>

            <div class="cloud-status">
                <span class="dot online" id="cloudDot"></span>
                <span id="cloudStatusText">☁️ 正在连接...</span>
            </div>

            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <div>加载图片中...</div>
            </div>

            <div class="gallery-grid" id="galleryGrid" style="display:none;"></div>

            <div class="empty-state" id="emptyState" style="display:none;">
                <span class="icon">🖼️</span>
                <div class="text">还没有上传图片</div>
                <div class="hint">点击下方按钮上传蜡染纹样</div>
            </div>

            <div class="refresh-tip">
                🔄 数据来自云端
                <span class="clickable" id="manualRefresh">点击刷新</span>
            </div>
        </div>

        <div class="btn-group">
            <a href="upload.html" class="btn btn-primary">📤 上传图片</a>
            <button class="btn btn-secondary" id="refreshBtn">🔄 刷新</button>
        </div>

        <div class="storage-info">
            💡 图片存储在 <strong>ImgBB 图床</strong>，链接同步到云端
            <br />
            <span style="font-size:0.7rem; opacity:0.7;">所有设备共享同一个云端数据</span>
        </div>

        <div class="footer-text">北京科技大学 染叙丹青实践小队</div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // 配置
        // ============================================================
        const BIN_ID = '6a6a1c77da38895dfea04a9c';
        const JSONBIN_KEY = '$2a$10$Zg02sHzfAK.F/xlvECOq1uOPkJrNLAPj7aBVmM8d.YMsvq4j.apUm';
        const BIN_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

        // ============================================================
        // DOM
        // ============================================================
        const galleryGrid = document.getElementById('galleryGrid');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const countDisplay = document.getElementById('countDisplay');
        const refreshBtn = document.getElementById('refreshBtn');
        const manualRefresh = document.getElementById('manualRefresh');
        const toast = document.getElementById('toast');
        const cloudStatusText = document.getElementById('cloudStatusText');
        const cloudDot = document.getElementById('cloudDot');

        let images = [];
        let isLoading = false;

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }

        // ============================================================
        // 获取缩略图
        // ============================================================
        function getThumbUrl(url) {
            if (!url) return url;
            const lastDot = url.lastIndexOf('.');
            if (lastDot > 0) {
                return url.substring(0, lastDot) + '_thumb' + url.substring(lastDot);
            }
            return url;
        }

        // ============================================================
        // 从云端加载
        // ============================================================
        async function loadFromCloud() {
            if (isLoading) return;
            isLoading = true;

            try {
                loadingState.style.display = 'block';
                galleryGrid.style.display = 'none';
                emptyState.style.display = 'none';
                countDisplay.textContent = '加载中...';
                cloudStatusText.textContent = '☁️ 加载中...';

                const url = BIN_URL + '/latest?meta=false&t=' + Date.now();

                const response = await fetch(url, {
                    headers: {
                        'X-Master-Key': JSONBIN_KEY,
                        'Cache-Control': 'no-cache'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    images = data.images || [];
                    images = images.filter(img => img && img.url);

                    cloudDot.className = 'dot online';
                    cloudStatusText.textContent = '☁️ 已连接 (' + images.length + ' 张)';
                    renderGallery();

                    if (images.length > 0) {
                        showToast('✅ 已加载 ' + images.length + ' 张图片');
                    }
                    return images;
                } else {
                    cloudDot.className = 'dot offline';
                    cloudStatusText.textContent = '⚠️ 加载失败';
                    showToast('⚠️ 加载失败，请刷新');
                    return null;
                }
            } catch (e) {
                console.error('加载失败:', e);
                cloudDot.className = 'dot offline';
                cloudStatusText.textContent = '⚠️ 网络异常';
                showToast('⚠️ 网络异常');
                return null;
            } finally {
                loadingState.style.display = 'none';
                isLoading = false;
            }
        }

        // ============================================================
        // 渲染
        // ============================================================
        function renderGallery() {
            if (images.length === 0) {
                galleryGrid.style.display = 'none';
                emptyState.style.display = 'block';
                countDisplay.textContent = '0 张';
                return;
            }

            galleryGrid.style.display = 'grid';
            emptyState.style.display = 'none';
            countDisplay.textContent = images.length + ' 张';

            galleryGrid.innerHTML = '';

            images.forEach((imgData, index) => {
                const thumbUrl = getThumbUrl(imgData.url);

                const item = document.createElement('div');
                item.className = 'gallery-item';
                item.innerHTML = `
                        <img src="${thumbUrl}" alt="${imgData.name || '纹样'}" loading="lazy" />
                        <span class="img-index">#${index + 1}</span>
                    `;

                item.addEventListener('click', function () {
                    if (imgData && imgData.url) {
                        window.open(imgData.url, '_blank');
                    }
                });

                galleryGrid.appendChild(item);
            });
        }

        // ============================================================
        // 刷新
        // ============================================================
        async function refresh() {
            showToast('🔄 刷新中...');
            await loadFromCloud();
            if (images.length > 0) {
                showToast('✅ 已刷新，共 ' + images.length + ' 张');
            }
        }

        // ============================================================
        // URL 参数
        // ============================================================
        function checkUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const imgData = params.get('img');
            if (imgData) {
                try {
                    const data = JSON.parse(decodeURIComponent(imgData));
                    if (data && data.url) {
                        setTimeout(() => {
                            loadFromCloud();
                            showToast('✅ 新图片已添加');
                        }, 500);
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (e) { }
            }
        }

        // ============================================================
        // 事件
        // ============================================================
        refreshBtn.addEventListener('click', refresh);
        manualRefresh.addEventListener('click', refresh);

        // ============================================================
        // 初始化
        // ============================================================
        async function init() {
            await loadFromCloud();
            checkUrlParams();
            console.log('📸 已加载，图片数:', images.length);
        }

        init();
    </script>

</body>
</html>
