<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>文本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7f6;
            color: #1a1a2e;
            line-height: 1.6;
            font-size: 16px;
            padding-bottom: 20px;
        }

        .hero-image {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #0b3d2e 0%, #1a6b4a 60%, #2d8f6a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }

            .hero-image .overlay {
                position: absolute;
                bottom: 0;
                left: 0;
                right: 0;
                padding: 16px 20px 14px;
                background: linear-gradient(transparent, rgba(0, 0, 0, 0.5));
                text-align: center;
            }

                .hero-image .overlay h1 {
                    font-size: 1.3rem;
                    font-weight: 700;
                }

                .hero-image .overlay p {
                    font-size: 0.8rem;
                    opacity: 0.85;
                }

        .container {
            padding: 16px 16px 0;
            max-width: 480px;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            padding: 18px 18px 20px;
            margin-top: 14px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #1a6b4a;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 12px;
            padding: 8px 0;
            -webkit-tap-highlight-color: transparent;
        }

            .back-link:active {
                opacity: 0.6;
            }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid #f0f2f1;
        }

            .contact-item:last-child {
                border-bottom: none;
            }

            .contact-item .c-icon {
                font-size: 1.8rem;
                width: 44px;
                text-align: center;
                flex-shrink: 0;
            }

            .contact-item .c-info .c-label {
                font-weight: 500;
                font-size: 0.9rem;
            }

            .contact-item .c-info .c-value {
                font-size: 0.9rem;
                color: #1a6b4a;
                word-break: break-all;
            }

                .contact-item .c-info .c-value a {
                    color: #1a6b4a;
                    text-decoration: none;
                }

        .btn-contact {
            display: block;
            width: 100%;
            background: #1a6b4a;
            color: #fff;
            padding: 14px;
            border-radius: 14px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent;
        }

            .btn-contact:active {
                background: #0b3d2e;
                transform: scale(0.98);
            }

        .social-row {
            display: flex;
            justify-content: space-around;
            padding: 12px 0 4px;
        }

            .social-row a {
                font-size: 2rem;
                text-decoration: none;
                -webkit-tap-highlight-color: transparent;
            }

                .social-row a:active {
                    transform: scale(0.9);
                }

        .footer-text {
            text-align: center;
            font-size: 0.75rem;
            color: #9ca3af;
            padding: 20px 0 8px;
        }
    </style>
</head>
<body>

    <div class="hero-image">
        <div class="overlay">
            <h1>关于我们</h1>
            <p>学校·小队成员</p>
        </div>
    </div>

    <div class="container">

        <a href="index.html" class="back-link">←返回首页</a>

        <div class="card">

            <div class="contact-item">
                <div class="c-icon">文本</div>
                <div class="c-info">
                    <div class="c-label">文本</div>
                    <div class="c-value">文本</div>
                </div>
            </div>

            <div class="contact-item">
                <div class="c-icon">文本</div>
                <div class="c-info">
                    <div class="c-label">文本</div>
                    <div class="c-value">文本</div>
                </div>
            </div>

            <div class="contact-item">
                <div class="c-icon">文本</div>
                <div class="c-info">
                    <div class="c-label">文本</div>
                    <div class="c-value">文本</div>
                </div>
            </div>

            <div class="contact-item">
                <div class="c-icon">文本</div>
                <div class="c-info">
                    <div class="c-label">文本</div>
                    <div class="c-value">文本</div>
                </div>
            </div>

            <div style="margin-top:10px; border-top:1px solid #f0f2f1; padding-top:12px;">
                <div style="font-weight:500; font-size:0.9rem; text-align:center; margin-bottom:6px;">文本</div>
                <div class="social-row">
                    <a href="#" style="color:#1a6b4a;">文本</a>
                    <a href="#" style="color:#1a6b4a;">文本</a>
                    <a href="#" style="color:#1a6b4a;">文本</a>
                    <a href="#" style="color:#1a6b4a;">文本</a>
                </div>
                <p style="text-align:center; font-size:0.7rem; color:#9ca3af; margin-top:2px;">文本</p>
            </div>

        </div>

        <a href="#" class="btn-contact">文本</a>

        <div class="footer-text">北京科技大学 染叙丹青实践小队</div>

    </div>

</body>
</html>
